pull_request_rules:

  - name: Automatic merge
    conditions:
      - "-label=Merge: Manual"
      - "label~=^Type:"
    actions:
      queue:


queue_rules:

  - name: default
    merge_method: squash
    queue_conditions:
      - or:
        - check-success = mergify-ci-status
        - "-files~=^(?!CHANGELOG\\.md$).*$"
      - "-draft"
      - "-closed"
      - "-conflict"
      - "label~=^Type:.*"
      - or:
          - "author=fabien-marty"
          - "#approved-reviews-by >= 1"
